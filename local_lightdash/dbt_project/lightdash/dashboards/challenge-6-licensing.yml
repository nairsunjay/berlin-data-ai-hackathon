  # Insights markdown
  - type: markdown
    tabUuid: "64848b47-badb-4335-a620-3df557508ebd"
    x: 0
    y: 11
    w: 36
    h: 5
    properties:
      title: "How to read this"
      content: |
        **AVOD vs TVOD Score** — higher AVOD score → good fit for ad-supported licensing (high volume, rewatchable).
        Higher TVOD score → premium or event-driven content better suited to rent/buy.

        **AVOD Gap Rate** — fraction of titles in that genre with strong demand but *no* current AVOD offer.
        A high gap rate = licensing opportunity: users want to watch for free but can't.

        > Drama and thriller dominate AVOD demand. High-gap-rate genres are the lowest-hanging fruit for JustWatch's new streaming service.

