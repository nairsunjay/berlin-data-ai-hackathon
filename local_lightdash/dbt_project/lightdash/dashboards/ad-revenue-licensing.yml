      title: "Est. Ad Revenue by Genre (Shows)"

  - type: saved_chart
    tabUuid: "19ea8f6e-d657-44f6-ac5c-197de5c4ab84"
    x: 20
    y: 1
    w: 16
    h: 12
    properties:
      chartSlug: "genre-avod-tvod-comparison"
      title: "AVOD vs TVOD Demand by Genre"

  # Genre insights
  - type: markdown
    tabUuid: "19ea8f6e-d657-44f6-ac5c-197de5c4ab84"
    x: 0
    y: 13
    w: 36
    h: 5
    properties:
      title: "Key genre insights"
      content: |
        **Drama shows** dominate with $7.1M estimated ad revenue potential — highest CPM ($25 base) and broad AVOD intent (85%).

        **Crime & Thriller** carry the highest CPM (~$18) relative to volume — premium advertiser segments.

        **Animation & Reality** show the highest AVOD intent share (89–92%) — audiences strongly prefer free/ad-supported for these genres.

        **TVOD opportunity** — genres with a high TVOD demand share (e.g. action movies, thrillers) are better suited for rent/buy licensing.

        > **Recommendation:** Prioritise drama and crime/thriller shows for AVOD licensing. Use TVOD for action/thriller movies with lower AVOD intent.

