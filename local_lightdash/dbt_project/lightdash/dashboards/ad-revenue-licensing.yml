  # Top 20 titles by ad revenue (full width)
  - type: saved_chart
    tabUuid: "9e0acc98-b075-40a0-982e-4f9b3a09f41b"
    x: 0
    y: 1
    w: 36
    h: 14
    properties:
      chartSlug: "top-20-titles-ad-revenue"
      title: "Top 20 Titles — Est. Ad Revenue (USD)"

  # Licensing score explainer
  - type: markdown
    tabUuid: "9e0acc98-b075-40a0-982e-4f9b3a09f41b"
    x: 0
    y: 15
    w: 36
    h: 4
    properties:
      title: "Est. Ad Revenue vs Licensing Score"
      content: |
        **Est. Ad Revenue** (this chart) — raw revenue potential based on demand volume × CPM.
        Titles with broad reach (e.g. One Piece) rank high here.

        **Licensing Score** = Est. Ad Revenue × Supply Gap Score × Quality Score
        This rewards titles that are *under-supplied* — fewer current providers means lower acquisition cost and higher ROI.

        > A title with $500K revenue and 1 provider (gap score 0.8) beats a $700K title available on 12 platforms (gap score 0.1) on licensing ROI.

