  # Row 3: Methodology note
  - type: markdown
    tabUuid: "21da8156-83a4-4480-8746-f1d14546417a"
    x: 0
    y: 15
    w: 36
    h: 4
    properties:
      title: "How revenue is estimated"
      content: |
        **Formula:** `Est. Ad Revenue = Estimated Views × Watch Hours × 6 ads/hr × adjusted CPM / 1000`

        **Adjusted CPM** = base genre CPM × audience multiplier × brand safety multiplier × freshness multiplier × AVOD tier multiplier

        **Audience & AVOD tier** — classified per title by Snowflake Cortex AI (llama3.1-8b) on top 10K most-engaged titles.
        Remaining titles default to Tier B / moderate brand safety.

        > **Revenue per user** measures market efficiency — FR and US show the highest return per engaged user despite lower total volume.

  # ── Title Rankings tab ────────────────────────────────────────────────────

  - type: heading
    tabUuid: "9e0acc98-b075-40a0-982e-4f9b3a09f41b"
