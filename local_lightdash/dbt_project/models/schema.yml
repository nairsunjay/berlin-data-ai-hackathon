version: 2

models:

  - name: orders_summary
    description: Aggregated order metrics by status, priority and month.
    columns:
      - name: order_status
        meta:
          dimension: { type: string, label: "Order Status" }
      - name: order_priority
        meta:
          dimension: { type: string, label: "Priority" }
      - name: order_month
        meta:
          dimension: { type: date, label: "Order Month", time_intervals: ["MONTH", "QUARTER", "YEAR"] }
      - name: order_count
        meta:
          metrics:
            total_orders: { type: sum, label: "Total Orders" }
      - name: total_revenue
        meta:
          metrics:
            sum_revenue: { type: sum, label: "Total Revenue", format: "usd" }
      - name: avg_order_value
        meta:
          metrics:
            mean_order_value: { type: average, label: "Avg Order Value", format: "usd" }
      - name: unique_customers
        meta:
          metrics:
            total_unique_customers: { type: sum, label: "Unique Customers" }

  - name: revenue_by_nation
    description: Customer revenue broken down by nation and region.
    columns:
      - name: nation
        meta:
          dimension: { type: string, label: "Nation" }
      - name: region
        meta:
          dimension: { type: string, label: "Region" }
      - name: order_year
        meta:
          dimension: { type: date, label: "Order Year", time_intervals: ["YEAR"] }
      - name: order_count
        meta:
          metrics:
            total_orders: { type: sum, label: "Total Orders" }
      - name: net_revenue
        meta:
          metrics:
            sum_net_revenue: { type: sum, label: "Net Revenue", format: "usd" }
      - name: net_profit
        meta:
          metrics:
            sum_net_profit: { type: sum, label: "Net Profit", format: "usd" }

  - name: part_performance
    description: Revenue and volume by part type, size and brand.
    columns:
      - name: part_type
        meta:
          dimension: { type: string, label: "Part Type" }
      - name: part_size
        meta:
          dimension: { type: number, label: "Part Size" }
      - name: brand
        meta:
          dimension: { type: string, label: "Brand" }
      - name: order_count
        meta:
          metrics:
            total_orders: { type: sum, label: "Total Orders" }
      - name: total_quantity
        meta:
          metrics:
            sum_quantity: { type: sum, label: "Total Quantity" }
      - name: net_revenue
        meta:
          metrics:
            sum_net_revenue: { type: sum, label: "Net Revenue", format: "usd" }
      - name: avg_discount_rate
        meta:
          metrics:
            mean_discount_rate: { type: average, label: "Avg Discount Rate", format: "percent" }

  - name: supplier_reliability
    description: Late shipment rate and average delay per supplier nation.
    columns:
      - name: supplier_nation
        meta:
          dimension: { type: string, label: "Supplier Nation" }
      - name: supplier_region
        meta:
          dimension: { type: string, label: "Supplier Region" }
      - name: total_lineitems
        meta:
          metrics:
            sum_lineitems: { type: sum, label: "Total Line Items" }
      - name: late_deliveries
        meta:
          metrics:
            sum_late_deliveries: { type: sum, label: "Late Deliveries" }
      - name: late_rate_pct
        meta:
          metrics:
            mean_late_rate: { type: average, label: "Late Rate %", format: "percent" }
      - name: avg_delay_days
        meta:
          metrics:
            mean_delay_days: { type: average, label: "Avg Delay (days)" }

  - name: weekly_sessions_by_country
    description: Weekly session counts by country from JustWatch event data.
    columns:
      - name: week_start
        meta:
          dimension: { type: date, label: "Week", time_intervals: ["WEEK", "MONTH"] }
      - name: geo_country
        meta:
          dimension: { type: string, label: "Country" }
      - name: session_count
        meta:
          metrics:
            total_sessions: { type: sum, label: "Total Sessions" }
      - name: unique_users
        meta:
          metrics:
            total_unique_users: { type: sum, label: "Unique Users" }
      - name: total_events
        meta:
          metrics:
            sum_events: { type: sum, label: "Total Events" }

  - name: fct_licensing_priority
    description: >
      Challenge 6 — Content Licensing Priority. Scores every title by AVOD and
      TVOD revenue potential. Use to rank titles for JustWatch licensing decisions.
    columns:
      - name: entity_id
        meta:
          dimension: { type: string, label: "Title ID" }
      - name: title
        meta:
          dimension: { type: string, label: "Title" }
      - name: object_type
        meta:
          dimension: { type: string, label: "Type (movie/show)" }
      - name: release_year
        meta:
          dimension: { type: number, label: "Release Year" }
      - name: imdb_score
        meta:
          dimension: { type: number, label: "IMDb Score" }
      - name: original_language
        meta:
          dimension: { type: string, label: "Language" }
      - name: market_count
        meta:
          dimension: { type: number, label: "Markets" }
      - name: has_avod_offer
        meta:
          dimension: { type: boolean, label: "Has AVOD Offer" }
      - name: has_svod_offer
        meta:
          dimension: { type: boolean, label: "Has SVOD Offer" }
      - name: has_tvod_offer
        meta:
          dimension: { type: boolean, label: "Has TVOD Offer" }
      - name: is_avod_gap
        meta:
          dimension: { type: boolean, label: "AVOD Gap (demand, no offer)" }
      - name: avod_score
        meta:
          metrics:
            total_avod_score: { type: sum, label: "Total AVOD Score" }
      - name: tvod_score
        meta:
          metrics:
            total_tvod_score: { type: sum, label: "Total TVOD Score" }
      - name: licensing_priority_score
        meta:
          metrics:
            avg_priority_score: { type: average, label: "Avg Priority Score" }
      - name: total_users
        meta:
          metrics:
            sum_users: { type: sum, label: "Total Users" }
      - name: avod_roi
        meta:
          metrics:
            avg_avod_roi: { type: average, label: "Avg AVOD ROI" }
      - name: tvod_roi
        meta:
          metrics:
            avg_tvod_roi: { type: average, label: "Avg TVOD ROI" }

  - name: fct_underserved_demand
    description: >
      Challenge 6 — Underserved Demand. Top-quartile AVOD demand titles with no
      current ad-supported offer — highest priority licensing targets.
    columns:
      - name: title
        meta:
          dimension: { type: string, label: "Title" }
      - name: object_type
        meta:
          dimension: { type: string, label: "Type (movie/show)" }
      - name: genres
        meta:
          dimension: { type: string, label: "Genres" }
      - name: release_year
        meta:
          dimension: { type: number, label: "Release Year" }
      - name: imdb_score
        meta:
          dimension: { type: number, label: "IMDb Score" }
      - name: market_count
        meta:
          dimension: { type: number, label: "Markets" }
      - name: demand_gap_rank
        meta:
          dimension: { type: number, label: "Demand Gap Rank" }
      - name: has_svod_offer
        meta:
          dimension: { type: boolean, label: "Has SVOD Offer" }
      - name: has_tvod_offer
        meta:
          dimension: { type: boolean, label: "Has TVOD Offer" }
      - name: avod_score
        meta:
          metrics:
            total_avod_score: { type: sum, label: "Total AVOD Score" }
      - name: tvod_score
        meta:
          metrics:
            total_tvod_score: { type: sum, label: "Total TVOD Score" }
      - name: total_users
        meta:
          metrics:
            sum_users: { type: sum, label: "Total Users" }
      - name: watchlist_adds
        meta:
          metrics:
            sum_watchlist_adds: { type: sum, label: "Watchlist Adds" }
      - name: avod_clickouts
        meta:
          metrics:
            sum_avod_clickouts: { type: sum, label: "AVOD Clickouts" }

  - name: fct_genre_licensing
    description: >
      Challenge 6 — Genre Licensing Analysis. AVOD vs TVOD suitability by genre.
      Use to answer: which genres suit ad-supported vs transactional licensing?
    columns:
      - name: genre
        meta:
          dimension: { type: string, label: "Genre" }
      - name: object_type
        meta:
          dimension: { type: string, label: "Type (movie/show)" }
      - name: title_count
        meta:
          metrics:
            sum_titles: { type: sum, label: "Title Count" }
      - name: total_avod_score
        meta:
          metrics:
            sum_avod_score: { type: sum, label: "Total AVOD Score" }
      - name: total_tvod_score
        meta:
          metrics:
            sum_tvod_score: { type: sum, label: "Total TVOD Score" }
      - name: avg_avod_roi
        meta:
          metrics:
            mean_avod_roi: { type: average, label: "Avg AVOD ROI" }
      - name: avg_tvod_roi
        meta:
          metrics:
            mean_tvod_roi: { type: average, label: "Avg TVOD ROI" }
      - name: avod_offer_rate
        meta:
          metrics:
            mean_avod_offer_rate: { type: average, label: "AVOD Offer Rate", format: "percent" }
      - name: avod_gap_rate
        meta:
          metrics:
            mean_avod_gap_rate: { type: average, label: "AVOD Gap Rate", format: "percent" }
      - name: avod_tvod_ratio
        meta:
          metrics:
            mean_avod_tvod_ratio: { type: average, label: "AVOD/TVOD Ratio" }
      - name: total_users
        meta:
          metrics:
            sum_users: { type: sum, label: "Total Users" }

  - name: mart_title_ad_revenue
    description: >
      Title-level ad revenue estimates (primary licensing output).
      One row per title. Revenue formula: est_ad_revenue = estimated_views × watch_hours × 6 ads/hr × adjusted_CPM / 1000.
      licensing_score = est_ad_revenue × supply_gap_score × quality_score_norm.
    columns:
      - name: title_id
        meta:
          dimension: { type: string, label: "Title ID" }
      - name: title
        meta:
          dimension: { type: string, label: "Title" }
      - name: object_type
        meta:
          dimension: { type: string, label: "Type (Movie/Show)" }
      - name: release_year
        meta:
          dimension: { type: number, label: "Release Year" }
      - name: freshness_category
        meta:
          dimension: { type: string, label: "Freshness" }
      - name: quality_tier
        meta:
          dimension: { type: string, label: "Quality Tier" }
      - name: genres
        meta:
          dimension: { type: string, label: "Genres" }
      - name: avod_tier
        meta:
          dimension: { type: string, label: "AVOD Tier (A/B/C)" }
      - name: audience_segment
        meta:
          dimension: { type: string, label: "Audience Segment" }
      - name: brand_safety
        meta:
          dimension: { type: string, label: "Brand Safety" }
      - name: has_avod_supply
        meta:
          dimension: { type: boolean, label: "Has AVOD Supply" }
      - name: supply_gap_score
        meta:
          dimension: { type: number, label: "Supply Gap Score" }
          metrics:
            avg_supply_gap: { type: average, label: "Avg Supply Gap Score" }
      - name: licensing_rank
        meta:
          dimension: { type: number, label: "Licensing Rank" }
      - name: licensing_score
        meta:
          metrics:
            total_licensing_score: { type: sum, label: "Total Licensing Score" }
            avg_licensing_score: { type: average, label: "Avg Licensing Score" }
      - name: est_ad_revenue_usd
        meta:
          metrics:
            total_est_ad_revenue: { type: sum, label: "Est. Ad Revenue (USD)", format: "usd" }
            avg_est_ad_revenue: { type: average, label: "Avg Est. Ad Revenue (USD)", format: "usd" }
      - name: est_tvod_revenue_usd
        meta:
          metrics:
            total_est_tvod_revenue: { type: sum, label: "Est. TVOD Revenue (USD)", format: "usd" }
      - name: estimated_views
        meta:
          metrics:
            total_estimated_views: { type: sum, label: "Total Estimated Views" }
      - name: avod_clickouts
        meta:
          metrics:
            total_avod_clickouts: { type: sum, label: "Total AVOD Clickouts" }
      - name: tvod_clickouts
        meta:
          metrics:
            total_tvod_clickouts: { type: sum, label: "Total TVOD Clickouts" }
      - name: total_users
        meta:
          metrics:
            total_users_reach: { type: sum, label: "Total Users (Reach)" }
      - name: adjusted_cpm
        meta:
          metrics:
            avg_adjusted_cpm: { type: average, label: "Avg Adjusted CPM (USD)", format: "usd" }
      - name: market_count
        meta:
          metrics:
            avg_market_count: { type: average, label: "Avg Markets Present" }

  - name: mart_genre_performance
    description: >
      Genre-level licensing strategy. Aggregates estimated ad revenue, CPM,
      and demand signals by genre. Answers: which genres are best for AVOD vs TVOD?
    columns:
      - name: genre
        meta:
          dimension: { type: string, label: "Genre" }
      - name: object_type
        meta:
          dimension: { type: string, label: "Type (Movie/Show)" }
      - name: title_count
        meta:
          metrics:
            sum_title_count: { type: sum, label: "Title Count" }
      - name: total_users
        meta:
          metrics:
            sum_total_users: { type: sum, label: "Total Users" }
      - name: total_avod_clickouts
        meta:
          metrics:
            sum_avod_clickouts: { type: sum, label: "Total AVOD Clickouts" }
      - name: total_tvod_clickouts
        meta:
          metrics:
            sum_tvod_clickouts: { type: sum, label: "Total TVOD Clickouts" }
      - name: avg_cpm
        meta:
          metrics:
            mean_cpm: { type: average, label: "Avg CPM (USD)", format: "usd" }
      - name: total_est_ad_revenue
        meta:
          metrics:
            sum_genre_ad_revenue: { type: sum, label: "Total Est. Ad Revenue (USD)", format: "usd" }
      - name: total_est_tvod_revenue
        meta:
          metrics:
            sum_genre_tvod_revenue: { type: sum, label: "Total Est. TVOD Revenue (USD)", format: "usd" }
      - name: total_est_revenue
        meta:
          metrics:
            sum_genre_total_revenue: { type: sum, label: "Total Est. Revenue (USD)", format: "usd" }
      - name: avg_supply_gap_score
        meta:
          metrics:
            mean_supply_gap: { type: average, label: "Avg Supply Gap Score" }
      - name: avod_coverage_rate
        meta:
          metrics:
            mean_avod_coverage: { type: average, label: "AVOD Coverage Rate", format: "percent" }
      - name: avg_quality_score
        meta:
          metrics:
            mean_quality: { type: average, label: "Avg Quality Score" }
      - name: avg_imdb_score
        meta:
          metrics:
            mean_imdb: { type: average, label: "Avg IMDb Score" }
      - name: avod_intent_share
        meta:
          metrics:
            mean_avod_intent: { type: average, label: "AVOD Intent Share", format: "percent" }
      - name: tvod_intent_share
        meta:
          metrics:
            mean_tvod_intent: { type: average, label: "TVOD Intent Share", format: "percent" }

  - name: mart_market_opportunity
    description: >
      Per-market licensing opportunity (T2 = 8 EU markets).
      Shows which markets have the highest AVOD revenue potential and supply gaps.
      Input to market entry decisions.
    columns:
      - name: market
        meta:
          dimension: { type: string, label: "Market (Country Code)" }
      - name: market_rank
        meta:
          dimension: { type: number, label: "Market Priority Rank" }
      - name: titles_with_demand
        meta:
          metrics:
            sum_titles_with_demand: { type: sum, label: "Titles with Demand" }
      - name: avg_clickout_rate
        meta:
          metrics:
            mean_clickout_rate: { type: average, label: "Avg Clickout Rate", format: "percent" }
      - name: total_unique_users
        meta:
          metrics:
            sum_unique_users: { type: sum, label: "Total Unique Users" }
      - name: total_events
        meta:
          metrics:
            sum_market_events: { type: sum, label: "Total Events" }
      - name: avod_clickouts
        meta:
          metrics:
            sum_market_avod: { type: sum, label: "AVOD Clickouts" }
      - name: tvod_clickouts
        meta:
          metrics:
            sum_market_tvod: { type: sum, label: "TVOD Clickouts" }
      - name: svod_clickouts
        meta:
          metrics:
            sum_market_svod: { type: sum, label: "SVOD Clickouts" }
      - name: watchlist_adds
        meta:
          metrics:
            sum_market_watchlist: { type: sum, label: "Watchlist Adds" }
      - name: est_ad_revenue
        meta:
          metrics:
            sum_market_ad_revenue: { type: sum, label: "Est. Ad Revenue (USD)", format: "usd" }
      - name: est_tvod_revenue
        meta:
          metrics:
            sum_market_tvod_revenue: { type: sum, label: "Est. TVOD Revenue (USD)", format: "usd" }
      - name: total_est_revenue
        meta:
          metrics:
            sum_market_total_revenue: { type: sum, label: "Total Est. Revenue (USD)", format: "usd" }
      - name: revenue_per_user
        meta:
          metrics:
            mean_revenue_per_user: { type: average, label: "Revenue Per User (USD)", format: "usd" }
